[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scrollback"
dynamic = ["version"]
description = "Navigate, search, copy, and export your AI coding-agent sessions (opencode, Claude Code, ...) from one local, read-only tool."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ahmed Attia" }]
keywords = [
    "opencode",
    "claude-code",
    "ai-agent",
    "session-history",
    "transcript",
    "cli",
    "local-first",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
# Runtime dependencies: everything an end user needs for the full
# experience -- CLI, web app, native app window, and coloured terminal
# output -- is installed by default. This means `pip install scrollback`
# (or `pipx install scrollback`) gives you the whole thing out of the box,
# with no extras to remember.
#
# pywebview drives the native app window; on Linux it additionally needs a
# system GTK/Qt WebKit backend at runtime, but its absence only disables
# the native window -- the browser fallback still works.
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "pywebview>=5.0",
    "rich>=13.0",
]

# Only development/maintenance extras remain. Runtime features are no
# longer gated behind extras -- see `dependencies` above.
[project.optional-dependencies]
# dev is self-sufficient for the full test suite. httpx is needed by
# Starlette's TestClient for the web-API tests; everything else the tests
# import (fastapi, uvicorn, rich) is already a runtime dependency.
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "httpx>=0.27",
]
# Tooling to regenerate the README screenshots (maintainers only). Needs a
# one-time `playwright install chromium` for the headless browser; neither
# this extra nor the browser binary is required to run scrollback.
screenshots = ["playwright>=1.40"]

[project.scripts]
scrollback = "scrollback.cli:main"
# Convenience entry points installed on PATH by pip, so users don't have to
# type the subcommand. `scrollback-web` == `scrollback web`, etc.
scrollback-web = "scrollback.cli:main_web"
scrollback-app = "scrollback.cli:main_app"

[project.urls]
Homepage = "https://github.com/a-attia/scrollback"
Repository = "https://github.com/a-attia/scrollback"
Issues = "https://github.com/a-attia/scrollback/issues"

[tool.hatch.version]
path = "src/scrollback/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/scrollback"]
# Non-Python package data (web assets + launchers + app icon) shipped in the wheel.
artifacts = [
    "src/scrollback/web/static/**",
    "src/scrollback/launchers/**",
    "src/scrollback/assets/**",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
